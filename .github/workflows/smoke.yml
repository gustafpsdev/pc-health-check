name: Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar o diagnóstico (modo demonstração)
        shell: pwsh
        run: ./Get-PCHealthReport.ps1 -DemoData
      - name: Publicar relatório de exemplo
        uses: actions/upload-artifact@v4
        with:
          name: pc-health-report-demo
          path: output/pc-health-report.html
